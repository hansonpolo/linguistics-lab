name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 检查产物
        run: test -f dist/index.html && du -sh dist

  smoke:
    name: 接口冒烟
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 播种数据库
        run: node server/seed.js --force
      - name: 启动服务并等待就绪
        run: |
          node server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/bootstrap > /dev/null; then
              echo "服务已就绪"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/api/bootstrap | head -c 200
      - name: 接口冒烟测试
        run: node scripts/smoke.mjs
      - name: Markdown 渲染自检
        run: node scripts/render-check.mjs
      - name: 失败时输出服务日志
        if: failure()
        run: cat server.log || true
